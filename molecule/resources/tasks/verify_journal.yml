---
# role: journald
# file: molecule/resources/tasks/verify_journal.yml

- name: JOURNALD | Exercise log ingestion, storage location and priority filtering
  become: true
  become_user: root
  ansible.builtin.script:
    cmd: >-
      ../scripts/verify_journal.py {{ __journald_expected_directory | quote }}
      {{ __journald_expected_messages | map('quote') | join(' ') }}
    executable: python3
